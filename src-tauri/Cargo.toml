[package]
name = "pier"
version = "0.5.0"
description = "An open-source, polished desktop tunneling tool — expose local ports to the internet in one click."
authors = ["cherish-zp"]
license = "MIT"
repository = "https://github.com/cherish-zp/shengShouMaTou"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio 运行时本体由 tauri 的 async_runtime 提供；这里只声明应用代码实际
# 用到的 API 面（engine/forwarder/tray/providers/ssh/util）：spawn、
# select!、#[tokio::test]、进程、TCP/UDP、定时器、异步文件 IO 与同步原语。
tokio = { version = "1.53.2", features = ["rt", "macros", "io-util", "net", "time", "fs", "process", "sync"] }
uuid = { version = "1.27.0", features = ["v4"] }
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
# Engine binary downloader (binman). reqwest 0.13 is already in the lock file
# (transitive dep of tauri); TLS: `native-tls` maps to schannel on Windows and
# Security.framework on macOS — no external build tools on either platform
# (reqwest 0.13 dropped the old `rustls-tls` feature; its `rustls` feature now
# pulls aws-lc-rs, which needs NASM on Windows MSVC).
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls", "system-proxy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
russh = "0.64.1"
russh-sftp = "3.0.1"
keyring = "4.2.0"
toml = "1.1.6"
base64 = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
